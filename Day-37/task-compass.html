<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Compass</title>
<style>
  :root{
    --bg:#0a0e1a;
    --bg2:#0d1220;
    --glass:rgba(255,255,255,0.045);
    --glass-border:rgba(255,255,255,0.09);
    --ink:#eef1fb;
    --ink-dim:#8b93b0;
    --ink-faint:#5a6180;
    --c-fe:#4ecdc4;
    --c-be:#6c5ce7;
    --c-qa:#fdcb6e;
    --c-pm:#ff6b9d;
    --c-ux:#a78bfa;
    --c-sup:#55c7f7;
    --c-em:#f0932b;
    --c-sales:#2ecc71;
    --accent:#7c8cff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family: -apple-system, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(ellipse 900px 600px at 15% -5%, rgba(124,140,255,0.14), transparent 60%),
      radial-gradient(ellipse 800px 700px at 105% 20%, rgba(108,92,231,0.12), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    padding: 28px 16px 60px;
    overflow-x: hidden;
  }
  .wrap{max-width: 980px; margin: 0 auto;}

  /* HEADER */
  header{text-align:center; margin-bottom: 28px;}
  .compass-mark{
    width:52px; height:52px; margin: 0 auto 14px;
    border-radius: 50%;
    border: 2px solid rgba(124,140,255,0.4);
    display:flex; align-items:center; justify-content:center;
    position: relative;
    animation: spin-slow 14s linear infinite;
  }
  .compass-mark::before{
    content:"";
    width:2px; height:18px;
    background: linear-gradient(180deg, var(--accent), transparent);
    position:absolute; top:6px;
  }
  @keyframes spin-slow{ to { transform: rotate(360deg);} }
  h1{
    font-size: 2.6rem; font-weight: 800; letter-spacing:-0.03em;
    background: linear-gradient(120deg, #fff 20%, #aab3ff 60%, #6c5ce7 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle{color: var(--ink-dim); font-size:1.02rem; margin-top:6px; letter-spacing:0.01em;}
  .org-tag{
    display:inline-block; margin-top:12px; font-size:0.72rem; letter-spacing:0.12em;
    text-transform:uppercase; color: var(--accent);
    border:1px solid rgba(124,140,255,0.35); padding:4px 12px; border-radius:20px;
    background: rgba(124,140,255,0.08);
  }

  /* PROGRESS */
  .progress-rail{
    display:flex; gap:8px; margin: 26px 0 8px; align-items:center;
  }
  .stage-pip{
    flex:1; height:6px; border-radius:4px; background: rgba(255,255,255,0.08);
    overflow:hidden; position:relative;
  }
  .stage-pip .fill{
    height:100%; width:0%; border-radius:4px;
    background: linear-gradient(90deg, var(--accent), #a78bfa);
    transition: width .5s cubic-bezier(.4,0,.2,1);
  }
  .progress-label{
    display:flex; justify-content:space-between; font-size:0.72rem; color:var(--ink-faint);
    letter-spacing:0.06em; text-transform:uppercase; margin-bottom:2px;
  }
  .score-strip{
    display:flex; gap:10px; justify-content:center; margin: 18px 0 6px; flex-wrap:wrap;
  }
  .score-chip{
    font-size:0.7rem; padding:5px 11px; border-radius:20px;
    background: var(--glass); border:1px solid var(--glass-border);
    color: var(--ink-dim); letter-spacing:0.03em;
  }
  .score-chip b{color:var(--ink); font-weight:700;}

  /* CARD SHELL */
  .panel{
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    padding: 30px;
    margin-top: 22px;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
    animation: rise .5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .stage-eyebrow{
    font-size:0.7rem; letter-spacing:0.15em; text-transform:uppercase;
    color: var(--accent); font-weight:700; margin-bottom:6px;
  }
  .stage-title{font-size:1.4rem; font-weight:800; margin-bottom:4px;}
  .stage-desc{color:var(--ink-dim); font-size:0.9rem; margin-bottom:22px;}

  /* TICKET */
  .ticket{
    background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 20px 22px;
    position: relative;
    margin-bottom: 24px;
  }
  .ticket::before, .ticket::after{
    content:""; position:absolute; width:16px; height:16px; border-radius:50%;
    background: var(--bg2); top:50%; transform:translateY(-50%);
  }
  .ticket::before{ left:-9px; }
  .ticket::after{ right:-9px; }
  .ticket-id{ font-family:"SF Mono", "Courier New", monospace; font-size:0.7rem; color:var(--ink-faint); letter-spacing:0.05em;}
  .ticket-text{ font-size:1.08rem; font-weight:600; margin-top:8px; line-height:1.5; }

  /* STAGE 1: ROLE GRID + SLOT */
  .slot{
    border: 2px dashed rgba(124,140,255,0.4);
    border-radius: 16px;
    padding: 18px;
    text-align:center;
    color: var(--ink-faint);
    font-size:0.85rem;
    margin-bottom: 22px;
    min-height: 70px;
    display:flex; align-items:center; justify-content:center;
    transition: all .25s ease;
  }
  .slot.dragover{ border-color: var(--accent); background: rgba(124,140,255,0.08); color:var(--ink); }
  .slot.filled{ border-style: solid; border-color: var(--accent); background: rgba(124,140,255,0.1); }
  .slot .placed-card{ pointer-events:none; }

  .role-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:12px;
  }
  .role-card{
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 14px 12px;
    cursor: grab;
    text-align:center;
    user-select:none;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    position:relative;
    overflow:hidden;
  }
  .role-card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:3px;
    background: var(--role-color, var(--accent));
  }
  .role-card:hover{ transform: translateY(-3px); box-shadow: 0 10px 24px -10px rgba(0,0,0,0.5); border-color: var(--role-color, var(--accent)); }
  .role-card.dragging{ opacity:0.4; }
  .role-card.selected{ border-color: var(--role-color, var(--accent)); background: rgba(255,255,255,0.08); box-shadow: 0 0 0 2px var(--role-color, var(--accent)) inset; }
  .role-card.disabled{ opacity:0.35; cursor:not-allowed; }
  .role-emoji{ font-size:1.5rem; display:block; margin-bottom:6px; }
  .role-name{ font-size:0.8rem; font-weight:700; }

  /* STAGE 2: ORDER SLOTS */
  .order-row{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:22px;
  }
  .order-slot{
    flex:1; min-width:110px;
    border: 2px dashed rgba(124,140,255,0.35);
    border-radius: 14px;
    min-height: 78px;
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-faint); font-size:0.72rem;
    text-align:center; padding:8px;
    position:relative;
    transition: all .2s ease;
  }
  .order-slot.dragover{ border-color: var(--accent); background: rgba(124,140,255,0.08); }
  .order-slot.filled{ border-style:solid; border-color: var(--accent); }
  .order-arrow{ color: var(--ink-faint); font-size:1.1rem; }
  .step-num{
    position:absolute; top:-9px; left:8px; font-size:0.62rem;
    background: var(--bg2); padding:1px 6px; border-radius:8px;
    border:1px solid var(--glass-border); color:var(--accent); font-weight:700;
  }

  /* STAGE 3 multi-select uses role-card.selected */

  /* BUTTONS */
  .btn-row{ display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; }
  button{
    font-family: inherit; font-size: 0.88rem; font-weight:700;
    padding: 12px 24px; border-radius: 12px; border: none; cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn-primary{
    background: linear-gradient(120deg, var(--accent), #a78bfa);
    color: #0a0e1a;
  }
  .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 10px 26px -10px rgba(124,140,255,0.6); }
  .btn-primary:disabled{ opacity:0.35; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-ghost{
    background: transparent; border: 1px solid var(--glass-border); color: var(--ink-dim);
  }
  .btn-ghost:hover{ color: var(--ink); border-color: var(--accent); }

  /* REVEAL */
  .reveal{
    margin-top: 22px; padding-top:22px; border-top: 1px solid var(--glass-border);
    animation: fadein .4s ease;
  }
  @keyframes fadein{ from{opacity:0;} to{opacity:1;} }
  .reveal-row{ margin-bottom: 14px; }
  .reveal-label{ font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; color: var(--ink-faint); margin-bottom:4px; }
  .reveal-value{ font-size:0.95rem; line-height:1.55; color: var(--ink); }
  .pill-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .pill{
    font-size:0.75rem; padding:5px 12px; border-radius:20px;
    border: 1px solid var(--glass-border); color: var(--ink-dim);
  }

  /* FLOW ANIMATION (stage2) */
  .flow-track{
    position:relative; height:48px; margin: 6px 0 18px;
    background: rgba(255,255,255,0.03); border-radius: 24px; overflow:hidden;
    border: 1px solid var(--glass-border);
  }
  .flow-token{
    position:absolute; top:6px; left:6px; width:36px; height:36px; border-radius:50%;
    background: var(--accent); display:flex; align-items:center; justify-content:center;
    font-size:1.1rem; transition: left 1s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 0 16px rgba(124,140,255,0.6);
  }

  /* SCORE / RESULTS */
  .results-grid{ display:grid; grid-template-columns: 1fr; gap:24px; }
  @media(min-width:720px){ .results-grid{ grid-template-columns: 1fr 1fr; } }
  canvas{ max-width:100%; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .bar-label{ width:110px; font-size:0.78rem; color:var(--ink-dim); flex-shrink:0; }
  .bar-track{ flex:1; height:10px; background: rgba(255,255,255,0.06); border-radius:6px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:6px; background: linear-gradient(90deg, var(--accent), #a78bfa); width:0%; transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
  .bar-val{ width:34px; text-align:right; font-size:0.78rem; font-weight:700; color: var(--ink); }

  .reflection-block{ margin-bottom:18px; }
  .reflection-title{ font-size:0.85rem; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
  .reflection-text{ font-size:0.88rem; color:var(--ink-dim); line-height:1.6; }
  .insight-box{
    margin-top: 10px; padding: 18px 20px; border-radius:14px;
    background: linear-gradient(120deg, rgba(124,140,255,0.12), rgba(167,139,250,0.08));
    border: 1px solid rgba(124,140,255,0.3);
    font-size:0.92rem; font-style:italic; color: var(--ink);
  }

  .celebrate{
    text-align:center; padding: 10px 0 4px;
  }
  .celebrate .big-emoji{ font-size:3rem; display:block; margin-bottom:8px; animation: pop .6s ease; }
  @keyframes pop{ 0%{transform:scale(0.4); opacity:0;} 70%{transform:scale(1.1);} 100%{transform:scale(1); opacity:1;} }

  footer{ text-align:center; color: var(--ink-faint); font-size:0.75rem; margin-top:36px; letter-spacing:0.03em; }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="compass-mark"></div>
    <h1>Task Compass</h1>
    <p class="subtitle">Learn how work flows through real organizations.</p>
    <span class="org-tag">🖥️ Tech Company</span>
  </header>

  <div class="progress-label" id="progressLabel">
    <span>Stage 1 · Who Owns This?</span>
    <span id="progressCount">Question 1 of 9</span>
  </div>
  <div class="progress-rail">
    <div class="stage-pip"><div class="fill" id="fillS1"></div></div>
    <div class="stage-pip"><div class="fill" id="fillS2"></div></div>
    <div class="stage-pip"><div class="fill" id="fillS3"></div></div>
  </div>

  <div class="score-strip">
    <span class="score-chip">Ownership <b id="chipOwn">0</b></span>
    <span class="score-chip">Delegation <b id="chipDel">0</b></span>
    <span class="score-chip">Collaboration <b id="chipCol">0</b></span>
    <span class="score-chip">Workflow <b id="chipFlow">0</b></span>
  </div>

  <div id="app"></div>

  <footer>Task Compass · A workplace simulation for tech company teams</footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- DATA ---------------- */

  const ROLES = {
    fe:  {name:"Frontend Developer", emoji:"🎨", color:"var(--c-fe)"},
    be:  {name:"Backend Developer",  emoji:"🛠️", color:"var(--c-be)"},
    qa:  {name:"QA Engineer",        emoji:"🔍", color:"var(--c-qa)"},
    pm:  {name:"Product Manager",    emoji:"🧭", color:"var(--c-pm)"},
    ux:  {name:"UX Designer",        emoji:"✏️", color:"var(--c-ux)"},
    sup: {name:"Customer Support",   emoji:"💬", color:"var(--c-sup)"},
    em:  {name:"Engineering Manager",emoji:"🧩", color:"var(--c-em)"},
    sales:{name:"Sales / Growth",    emoji:"📈", color:"var(--c-sales)"}
  };
  const ALL_ROLE_KEYS = Object.keys(ROLES);

  // STAGE 1: Ownership
  const STAGE1 = [
    {
      id:"S1-104", text:"A customer reports that payments fail only on iPhones.",
      owner:"fe", assist:["qa","be"],
      why:"Payment failures isolated to one platform usually trace to a rendering or client-side integration issue, which is the Frontend Developer's territory. They reproduce it, then loop in Backend if the payment API itself is misbehaving."
    },
    {
      id:"S1-112", text:"The database is timing out under normal traffic load.",
      owner:"be", assist:["em","qa"],
      why:"Database performance under load sits squarely with the Backend Developer, who owns the data layer and query efficiency. The Engineering Manager may get pulled in if infrastructure scaling decisions are needed."
    },
    {
      id:"S1-119", text:"Users say the onboarding flow feels confusing and they drop off early.",
      owner:"ux", assist:["pm","fe"],
      why:"A confusing flow is a design and usability problem first, so the UX Designer owns diagnosing friction points. Product Manager helps prioritize the fix, and Frontend implements it."
    },
    {
      id:"S1-127", text:"A critical security vulnerability was found in the login system.",
      owner:"be", assist:["em","qa"],
      why:"Security flaws in authentication logic are backend territory since login systems are typically server-side. The Engineering Manager coordinates urgency and QA verifies the patch closes the gap."
    },
    {
      id:"S1-133", text:"Support is getting flooded with tickets about a confusing error message.",
      owner:"sup", assist:["ux","fe"],
      why:"Customer Support owns the first response since they're closest to affected users and can triage volume. They escalate the actual wording/logic problem to UX and Frontend to fix at the source."
    },
    {
      id:"S1-141", text:"A/B test results show a new feature isn't improving conversion as expected.",
      owner:"pm", assist:["sales","ux"],
      why:"Interpreting test results against business goals and deciding what happens next is core Product Manager work. Sales/Growth and UX contribute data and design perspective to the decision."
    },
    {
      id:"S1-148", text:"The mobile app crashes intermittently on Android devices only.",
      owner:"fe", assist:["qa","em"],
      why:"Platform-specific crashes point to the client codebase, making this a Frontend Developer issue. QA reproduces across device variants, and the Engineering Manager helps prioritize against other work."
    },
    {
      id:"S1-155", text:"A competitor just launched a feature your users have been asking for.",
      owner:"pm", assist:["sales","ux"],
      why:"Deciding how to respond to competitive pressure is a product strategy call, so the Product Manager owns it. Sales shares what they're hearing from prospects, and UX shapes how it should feel."
    },
    {
      id:"S1-162", text:"The release notes for the last update contain factual errors about what changed.",
      owner:"pm", assist:["sup","em"],
      why:"Release notes represent what the product team is communicating externally, so the Product Manager is accountable for accuracy. Support flags the confusion it's causing, and the Engineering Manager confirms the technical facts."
    }
  ];

  // STAGE 2: Task Routing (workflow order)
  const STAGE2 = [
    {
      id:"S2-201", text:"A customer reports a bug through the help widget.",
      workflow:["sup","qa","be","fe","sup"],
      why:"Support intake catches the report first. QA reproduces and confirms it's real before engineering spends time on it. Backend or Frontend fixes it depending on where the bug lives, then it loops back to Support to close the loop with the customer."
    },
    {
      id:"S2-208", text:"Product wants to launch a small experimental feature to test demand.",
      workflow:["pm","ux","fe","qa"],
      why:"Product Manager scopes the experiment and success criteria. UX sketches the minimal experience, Frontend builds it fast, and QA gives it a lightweight check before it ships to a small audience."
    },
    {
      id:"S2-215", text:"A major client requests a custom integration with their internal tools.",
      workflow:["sales","pm","be","em"],
      why:"Sales surfaces the request from the client relationship. Product Manager evaluates whether it fits the roadmap, Backend scopes the technical build, and the Engineering Manager signs off on resourcing."
    }
  ];

  // STAGE 3: Collaboration Challenge
  const STAGE3 = [
    {
      id:"S3-301", text:"Customer satisfaction suddenly drops after the latest release.",
      primary:"pm",
      supporting:["sup","qa","fe"],
      why:"The Product Manager owns understanding what changed and why it's hurting satisfaction. Support brings direct customer feedback, QA checks for regressions, and Frontend investigates anything visibly broken.",
      flow:"Support flags the pattern → PM investigates scope → QA + Frontend diagnose the technical cause → PM communicates a fix timeline back through Support."
    },
    {
      id:"S3-308", text:"Sales increase dramatically and the system starts struggling to keep up.",
      primary:"be",
      supporting:["em","sales","pm"],
      why:"Backend owns keeping the system stable under load. The Engineering Manager coordinates urgency and resourcing, Sales shares growth forecasts, and Product Manager decides what can be deprioritized to free up capacity.",
      flow:"Sales reports growth trend → EM + Backend assess system risk → PM adjusts roadmap priorities → Sales is updated on stability timeline."
    },
    {
      id:"S3-315", text:"A major feature is delayed and a client is expecting it this week.",
      primary:"em",
      supporting:["pm","sales","be"],
      why:"The Engineering Manager owns communicating realistic timelines and unblocking the team. Product Manager decides what can slip, Sales manages the client relationship, and Backend reports the actual technical blocker.",
      flow:"Backend reports the blocker → EM assesses timeline impact → PM + Sales align on what to tell the client → Sales delivers the update."
    }
  ];

  /* ---------------- STATE ---------------- */

  const state = {
    stage: 1,
    s1Index: 0, s2Index: 0, s3Index: 0,
    s1Answers: [], s2Answers: [], s3Answers: [],
    scores: { ownership:0, delegation:0, collaboration:0, workflow:0 },
    scoreMax: { ownership:0, delegation:0, collaboration:0, workflow:0 }
  };

  const TOTAL_QUESTIONS = STAGE1.length >= 3 ? 3 : STAGE1.length; // we only *use* 3 per stage per spec, but keep bank of 8-10 for stage1
  const S1_USE = 3, S2_USE = 3, S3_USE = 3;

  const app = document.getElementById("app");

  function pick(arr, n){
    // deterministic-ish shuffle then take n, so repeated plays vary slightly
    const copy = arr.slice();
    for(let i=copy.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [copy[i],copy[j]] = [copy[j],copy[i]];
    }
    return copy.slice(0,n);
  }

  const activeS1 = pick(STAGE1, S1_USE);
  const activeS2 = pick(STAGE2, S2_USE);
  const activeS3 = pick(STAGE3, S3_USE);

  function updateChips(){
    document.getElementById("chipOwn").textContent = state.scores.ownership;
    document.getElementById("chipDel").textContent = state.scores.delegation;
    document.getElementById("chipCol").textContent = state.scores.collaboration;
    document.getElementById("chipFlow").textContent = state.scores.workflow;
  }

  function updateProgress(){
    const labels = {
      1:"Stage 1 · Who Owns This?",
      2:"Stage 2 · Task Routing",
      3:"Stage 3 · Collaboration Challenge",
      4:"Complete"
    };
    document.getElementById("progressLabel").firstElementChild.textContent = labels[state.stage] || "Complete";
    let count = "";
    if(state.stage===1) count = `Question ${Math.min(state.s1Index+1,S1_USE)} of ${S1_USE}`;
    else if(state.stage===2) count = `Question ${Math.min(state.s2Index+1,S2_USE)} of ${S2_USE}`;
    else if(state.stage===3) count = `Question ${Math.min(state.s3Index+1,S3_USE)} of ${S3_USE}`;
    else count = "9 of 9";
    document.getElementById("progressCount").textContent = count;

    document.getElementById("fillS1").style.width = (Math.min(state.s1Index,S1_USE)/S1_USE*100) + "%";
    document.getElementById("fillS2").style.width = (state.stage>1 ? Math.min(state.s2Index,S2_USE)/S2_USE*100 : 0) + "%";
    document.getElementById("fillS3").style.width = (state.stage>2 ? Math.min(state.s3Index,S3_USE)/S3_USE*100 : 0) + "%";
  }

  /* ---------------- RENDER: STAGE 1 ---------------- */

  function renderStage1(){
    const task = activeS1[state.s1Index];
    if(!task){ state.stage = 2; render(); return; }

    let filledRole = null;

    const wrap = document.createElement("div");
    wrap.className = "panel";
    wrap.innerHTML = `
      <div class="stage-eyebrow">Stage 1 · Ownership</div>
      <div class="stage-title">Who owns this?</div>
      <div class="stage-desc">Drag the role that should take primary ownership into the slot below.</div>
      <div class="ticket">
        <div class="ticket-id">TICKET #${task.id}</div>
        <div class="ticket-text">${task.text}</div>
      </div>
      <div class="slot" id="ownerSlot" data-label="Drop the owning role here">Drop the owning role here</div>
      <div class="role-grid" id="roleGrid"></div>
      <div class="btn-row">
        <button class="btn-primary" id="submitBtn" disabled>Confirm Ownership</button>
      </div>
      <div id="revealArea"></div>
    `;
    app.innerHTML = "";
    app.appendChild(wrap);

    const grid = wrap.querySelector("#roleGrid");
    ALL_ROLE_KEYS.slice(0,8).forEach(key=>{
      const r = ROLES[key];
      const card = document.createElement("div");
      card.className = "role-card";
      card.style.setProperty("--role-color", r.color);
      card.draggable = true;
      card.dataset.role = key;
      card.innerHTML = `<span class="role-emoji">${r.emoji}</span><span class="role-name">${r.name}</span>`;

      card.addEventListener("dragstart", e=>{
        e.dataTransfer.setData("text/plain", key);
        card.classList.add("dragging");
      });
      card.addEventListener("dragend", ()=> card.classList.remove("dragging"));
      card.addEventListener("click", ()=> selectRole(key)); // tap-to-select fallback for mobile

      grid.appendChild(card);
    });

    const slot = wrap.querySelector("#ownerSlot");
    slot.addEventListener("dragover", e=>{ e.preventDefault(); slot.classList.add("dragover"); });
    slot.addEventListener("dragleave", ()=> slot.classList.remove("dragover"));
    slot.addEventListener("drop", e=>{
      e.preventDefault();
      slot.classList.remove("dragover");
      const key = e.dataTransfer.getData("text/plain");
      if(key) selectRole(key);
    });

    function selectRole(key){
      filledRole = key;
      const r = ROLES[key];
      slot.classList.add("filled");
      slot.innerHTML = `<span class="placed-card">${r.emoji} <strong>${r.name}</strong></span>`;
      wrap.querySelectorAll(".role-card").forEach(c=>{
        c.classList.toggle("selected", c.dataset.role===key);
      });
      wrap.querySelector("#submitBtn").disabled = false;
    }

    wrap.querySelector("#submitBtn").addEventListener("click", ()=>{
      wrap.querySelector("#submitBtn").disabled = true;
      wrap.querySelectorAll(".role-card").forEach(c=> c.style.pointerEvents="none");
      slot.style.pointerEvents = "none";

      const correct = filledRole === task.owner;
      state.scoreMax.ownership += 2;
      state.scoreMax.delegation += 1;
      if(correct) state.scores.ownership += 2;
      else state.scores.ownership += (task.assist.includes(filledRole) ? 1 : 0);

      const assistedCorrectly = task.assist.includes(filledRole) || correct;
      if(assistedCorrectly) state.scores.delegation += 1;

      state.s1Answers.push({task, picked:filledRole, correct});
      updateChips();
      renderReveal1(wrap, task, filledRole, correct);
    });

    updateProgress();
  }

    const grid2 = wrap.querySelector("#roleGrid2");

        e.dataTransfer.setData("text/plain", key);
        card.classList.add("dragging");
      });
      card.addEventListener("dragend", ()=> card.classList.remove("dragging"));
      card.addEventListener("click", ()=> placeInFirstEmpty(key));
      grid2.appendChild(card);
    });

    function refreshAvailability(){
      grid2.querySelectorAll(".role-card").forEach(c=>{
        c.classList.toggle("disabled", usedKeys.has(c.dataset.role));
      });
      wrap.querySelector("#submitBtn2").disabled = placed.includes(null);

    function placeAt(index, key){
      if(usedKeys.has(key)) return;
      const slotEl = orderRow.querySelectorAll(".order-slot")[index];
      if(placed[index]) usedKeys.delete(placed[index]);
      placed[index] = key;
      usedKeys.add(key);
      const r = ROLES[key];
      slotEl.classList.add("filled");
      slotEl.querySelector(".slot-content").innerHTML = `${r.emoji} <strong>${r.name}</strong>`;
      refreshAvailability();
    }

    function placeInFirstEmpty(key){
      if(usedKeys.has(key)) return;
      const idx = placed.findIndex(p=>p===null);
      if(idx !== -1) placeAt(idx, key);
    }

    orderRow.querySelectorAll(".order-slot").forEach(slotEl=>{
      slotEl.addEventListener("dragover", e=>{ e.preventDefault(); slotEl.classList.add("dragover"); });
      slotEl.addEventListener("dragleave", ()=> slotEl.classList.remove("dragover"));
      slotEl.addEventListener("drop", e=>{
        e.preventDefault();
        slotEl.classList.remove("dragover");
        const key = e.dataTransfer.getData("text/plain");
        if(key) placeAt(parseInt(slotEl.dataset.index,10), key);
      });
    });

    wrap.querySelector("#clearBtn2").addEventListener("click", ()=>{
      placed.fill(null);
      usedKeys.clear();
      orderRow.querySelectorAll(".order-slot").forEach((s,i)=>{

        s.querySelector(".slot-content").textContent = "Drop role";

      refreshAvailability();

      let correctSteps = 0;
      placed.forEach((k,i)=>{ if(k === task.workflow[i]) correctSteps++; });
      const accuracy = correctSteps / steps;

      state.scoreMax.workflow += 2;
      state.scores.workflow += Math.round(accuracy * 2);
      state.scoreMax.delegation += 1;
      state.scores.delegation += accuracy >= 0.5 ? 1 : 0;

      state.s2Answers.push({task, placed, accuracy});

      animateFlowThenReveal(wrap, task, placed, accuracy);

  function animateFlowThenReveal(wrap, task, placed, accuracy){
    const area = wrap.querySelector("#revealArea2");
    area.innerHTML = `
      <div class="reveal">
        <div class="reveal-label">Watch the task move through the org</div>
        <div class="flow-track" id="flowTrack">
          <div class="flow-token" id="flowToken">📨</div>
        </div>
      </div>
    `;
    const track = area.querySelector("#flowTrack");
    const token = area.querySelector("#flowToken");
    const steps = task.workflow.length;
    let i = 0;
    function step(){
      const trackWidth = track.clientWidth - 42;
      const x = steps<=1 ? 0 : (trackWidth * (i/(steps-1)));
      token.style.left = x + "px";
      i++;
      if(i <= steps-1){
        setTimeout(step, 550);
      } else {
        setTimeout(()=> finishReveal2(wrap, task, placed, accuracy), 500);
      }
    }
    setTimeout(step, 200);
  }

  /* ---------------- RESULTS ---------------- */

  function pct(score, max){ return max>0 ? Math.round((score/max)*100) : 0; }

  function drawRadar(canvas, data){
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const size = canvas.clientWidth;
    canvas.width = size*dpr; canvas.height = size*dpr;
    ctx.scale(dpr,dpr);
    const cx = size/2, cy = size/2, radius = size*0.36;
    const labels = Object.keys(data);
    const n = labels.length;
    const colors = "rgba(124,140,255,0.85)";

    ctx.clearRect(0,0,size,size);

    // grid rings
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.lineWidth = 1;
    for(let ring=1; ring<=4; ring++){
      ctx.beginPath();
      for(let i=0;i<=n;i++){
        const angle = (Math.PI*2*i/n) - Math.PI/2;
        const r = radius*(ring/4);
        const x = cx + r*Math.cos(angle);
        const y = cy + r*Math.sin(angle);
        i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    // axes + labels
    ctx.fillStyle = "rgba(139,147,176,0.9)";
    ctx.font = "600 11px -apple-system, sans-serif";
    labels.forEach((label,i)=>{
      const angle = (Math.PI*2*i/n) - Math.PI/2;
      const x = cx + (radius+22)*Math.cos(angle);
      const y = cy + (radius+22)*Math.sin(angle);
      ctx.strokeStyle = "rgba(255,255,255,0.06)";
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.lineTo(cx+radius*Math.cos(angle), cy+radius*Math.sin(angle));
      ctx.stroke();
      ctx.textAlign = "center";
      ctx.fillText(label, x, y);
    });
    // data polygon
    ctx.beginPath();
    labels.forEach((label,i)=>{
      const angle = (Math.PI*2*i/n) - Math.PI/2;
      const val = data[label]/100;
      const x = cx + radius*val*Math.cos(angle);
      const y = cy + radius*val*Math.sin(angle);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.fillStyle = "rgba(124,140,255,0.28)";
    ctx.fill();
    ctx.strokeStyle = colors;
    ctx.lineWidth = 2;
    ctx.stroke();
    // dots
    labels.forEach((label,i)=>{
      const angle = (Math.PI*2*i/n) - Math.PI/2;
      const val = data[label]/100;
      const x = cx + radius*val*Math.cos(angle);
      const y = cy + radius*val*Math.sin(angle);
      ctx.beginPath();
      ctx.arc(x,y,3.5,0,Math.PI*2);
      ctx.fillStyle = "#eef1fb";
      ctx.fill();
    });
  }

  function buildReflection(){
    const s1Correct = state.s1Answers.filter(a=>a.correct).length;
    const s2AvgAcc = state.s2Answers.reduce((sum,a)=>sum+a.accuracy,0) / (state.s2Answers.length||1);
    const overAssignCount = state.s3Answers.filter(a=>a.overAssigned).length;
    const underCollabCount = state.s3Answers.filter(a=>a.underCollaborated).length;
    const goodCollabCount = state.s3Answers.filter(a=>a.hasPrimary && a.overlap>=2).length;

    let wellText = [];
    if(s1Correct >= 2) wellText.push("You consistently identified the right primary owner for ownership questions — a strong instinct for who's actually accountable.");
    if(s2AvgAcc >= 0.6) wellText.push("Your task-routing sequences closely matched how work commonly flows through a tech org, step by step.");
    if(goodCollabCount >= 1) wellText.push("On complex situations, you tended to bring in the right mix of primary and supporting roles rather than defaulting to just one.");
    if(wellText.length===0) wellText.push("You engaged thoughtfully with every scenario, and the patterns below are a good starting map for where to sharpen next.");

    let overText = [];
    if(overAssignCount >= 2) overText.push("On a couple of the bigger situations, you assigned more roles than the scenario typically needs — a sign of thoroughness, though it can blur who actually drives the decision.");
    else if(overAssignCount === 1) overText.push("In one collaboration challenge, you spread ownership a bit wide. It's worth asking who the single decision-maker should be, even when many people are involved.");
    else overText.push("You generally kept ownership focused rather than spreading it across too many roles — a healthy instinct.");

    let underText = [];
    if(underCollabCount >= 1) underText.push("In at least one big-picture situation, you assigned very few roles. Some real workplace problems that look simple on the surface actually benefit from more perspectives than expected.");
    else if(s2AvgAcc < 0.5) underText.push("Your workflow routing sometimes skipped steps that teams typically rely on, like a QA check or manager sign-off — steps that quietly prevent bigger problems downstream.");
    else underText.push("You seemed comfortable pulling in multiple people when a situation called for it, rather than assuming one person could solve everything alone.");

    const insights = [
      "Many real workplace problems are solved by teams rather than individuals.",
      "Ownership doesn't mean working alone — it means being accountable for the outcome, even when others help.",
      "The order work moves through an organization often matters as much as who does it.",
      "Escalation isn't a failure — it's often the fastest way to get the right expertise on a problem."
    ];
    const insight = insights[Math.floor(Math.random()*insights.length)];

    return { wellText, overText, underText, insight };
  }

          <div class="bar-row"><div class="bar-label">Delegation</div><div class="bar-track"><div class="bar-fill" id="barDel"></div></div><div class="bar-val">${del}%</div></div>

    const r = buildReflection();

      </div>
      <div class="reflection-block">
        <div class="reflection-title">🤝 Where you underestimated collaboration</div>
        <div class="reflection-text">${r.underText.join(" ")}</div>
      </div>
      <div class="insight-box">"${r.insight}"</div>
    `;

    wrap.querySelector("#restartBtn").addEventListener("click", ()=>{
      window.location.reload();

    document.getElementById("progressLabel").firstElementChild.textContent = "Complete";
    document.getElementById("progressCount").textContent = "9 of 9";
    document.getElementById("fillS1").style.width = "100%";
    document.getElementById("fillS2").style.width = "100%";
    document.getElementById("fillS3").style.width = "100%";

  /* ---------------- MASTER RENDER ---------------- */
