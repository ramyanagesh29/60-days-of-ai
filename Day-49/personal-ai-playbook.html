<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal AI Playbook — Ramya's Workflow System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#0F1119;
  --panel:#171A25;
  --panel-2:#1D2130;
  --panel-3:#242939;
  --line:#2B3044;
  --indigo:#6C63FF;
  --indigo-soft:rgba(108,99,255,.15);
  --amber:#F2A93B;
  --amber-soft:rgba(242,169,59,.15);
  --mist:#9BA3B7;
  --mist-dim:#6B7286;
  --paper:#EEF0F6;
  --paper-hi:#FFFFFF;
  --green:#4ADE80;
  --red:#F87171;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --radius:14px;
  --radius-sm:8px;
  --shadow-lg:0 20px 60px -20px rgba(0,0,0,.6);
  --shadow-sm:0 4px 16px -8px rgba(0,0,0,.5);
}
[data-theme="light"]{
  --ink:#F3F1EC;
  --panel:#FFFFFF;
  --panel-2:#F7F6F2;
  --panel-3:#EFEDE6;
  --line:#DEDBD1;
  --mist:#6B6B6B;
  --mist-dim:#93938A;
  --paper:#1B1B1B;
  --paper-hi:#000000;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
  transition:background .3s ease,color .3s ease;
}
::selection{background:var(--indigo);color:#fff;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--indigo);}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-.01em;}

.hidden{display:none !important;}

/* ============ APP SHELL ============ */
.app{display:flex;min-height:100vh;}

/* ---- Sidebar ---- */
.sidebar{
  width:260px;flex-shrink:0;background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40;
}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line);}
.brand-mark{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.brand-logo{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--indigo),#8b7fff);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;color:#fff;font-size:15px;
  box-shadow:0 6px 16px -4px rgba(108,99,255,.6);
  flex-shrink:0;
}
.brand-title{font-family:var(--font-display);font-size:15.5px;font-weight:600;line-height:1.2;}
.brand-sub{font-size:11.5px;color:var(--mist-dim);margin-top:2px;}

.nav{padding:14px 12px;flex:1;}
.nav-group-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mist-dim);
  padding:14px 10px 8px;font-weight:600;
}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
  font-size:13.5px;color:var(--mist);background:none;border:none;width:100%;text-align:left;
  transition:background .15s,color .15s;margin-bottom:2px;
}
.nav-item:hover{background:var(--panel-2);color:var(--paper);}
.nav-item.active{background:var(--indigo-soft);color:var(--indigo);font-weight:600;}
[data-theme="light"] .nav-item.active{color:#4A42D6;}
.nav-icon{width:18px;height:18px;flex-shrink:0;}
.nav-kbd{
  margin-left:auto;font-size:10px;font-family:var(--font-mono);color:var(--mist-dim);
  background:var(--panel-3);padding:2px 6px;border-radius:5px;
}

.sidebar-footer{padding:14px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;}
.footer-btn{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;
  font-size:13px;color:var(--mist);background:none;border:none;width:100%;text-align:left;
}
.footer-btn:hover{background:var(--panel-2);color:var(--paper);}

/* ---- Main ---- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(15,17,25,.85);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:16px 32px;display:flex;align-items:center;gap:16px;
}
[data-theme="light"] .topbar{background:rgba(255,255,255,.85);}
.topbar-title{font-family:var(--font-display);font-size:20px;font-weight:600;}
.topbar-sub{font-size:12.5px;color:var(--mist-dim);margin-top:1px;}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px;}

.content{padding:28px 32px 80px;max-width:1180px;width:100%;margin:0 auto;}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;
  font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--panel-2);
  color:var(--paper);transition:all .15s;white-space:nowrap;
}
.btn:hover{background:var(--panel-3);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--indigo);border-color:var(--indigo);color:#fff;}
.btn-primary:hover{background:#5b52ee;box-shadow:0 8px 20px -6px rgba(108,99,255,.6);}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--panel-2);}
.btn-icon{width:34px;height:34px;padding:0;justify-content:center;flex-shrink:0;}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn-danger{color:var(--red);}
.btn svg{width:14px;height:14px;}

/* ============ EXPLAINER BANNER (persistent) ============ */
.explainer{
  background:linear-gradient(120deg,var(--indigo-soft),transparent 70%),var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;
  margin-bottom:24px;position:relative;
}
.explainer-close{position:absolute;top:12px;right:12px;}
.explainer h3{font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.explainer p{font-size:13.5px;color:var(--mist);line-height:1.6;max-width:760px;}
.explainer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:14px;}
.explainer-chip{
  background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
}
.explainer-chip b{font-size:12.5px;display:block;margin-bottom:2px;}
.explainer-chip span{font-size:11.5px;color:var(--mist-dim);}

/* ============ CARDS / SECTIONS ============ */
.section{margin-bottom:36px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
.section-head h2{font-size:17px;}
.section-head .muted{font-size:12.5px;color:var(--mist-dim);}

.grid{display:grid;gap:14px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid-3{grid-template-columns:1fr 1fr;}}
@media(max-width:640px){.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;
}
.stat-card .num{font-family:var(--font-display);font-size:28px;font-weight:700;}
.stat-card .lbl{font-size:12px;color:var(--mist-dim);margin-top:2px;}

.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;transition:border-color .15s,transform .15s;position:relative;
}
.card:hover{border-color:var(--indigo);}

.workflow-card{display:flex;flex-direction:column;gap:10px;cursor:pointer;}
.wf-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.wf-icon{
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.wf-title{font-family:var(--font-display);font-size:14.5px;font-weight:600;line-height:1.3;}
.wf-desc{font-size:12.5px;color:var(--mist-dim);line-height:1.5;}
.wf-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
.tag{
  font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:99px;
  background:var(--panel-3);color:var(--mist);border:1px solid var(--line);
}
.tag.model{background:var(--indigo-soft);color:var(--indigo);border-color:transparent;}
.fav-btn{background:none;border:none;color:var(--mist-dim);width:26px;height:26px;border-radius:8px;flex-shrink:0;}
.fav-btn:hover{background:var(--panel-2);}
.fav-btn.active{color:var(--amber);}
.wf-actions{display:flex;gap:6px;margin-top:4px;}

/* ============ FORMS ============ */
.field{margin-bottom:14px;}
.field label{
  display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--paper);
}
.field .hint{font-size:11.5px;color:var(--mist-dim);font-weight:400;margin-top:3px;line-height:1.5;}
.field select,.field input[type=text],.field textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
  color:var(--paper);padding:9px 12px;font-size:13px;transition:border-color .15s;
}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--indigo);}
.field textarea{resize:vertical;min-height:70px;line-height:1.5;}
.help-dot{
  width:15px;height:15px;border-radius:50%;background:var(--panel-3);color:var(--mist);
  display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
  border:1px solid var(--line);cursor:help;flex-shrink:0;
}

/* ============ TABS ============ */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;}
.tab{
  padding:10px 4px;font-size:13px;font-weight:600;color:var(--mist-dim);background:none;border:none;
  border-bottom:2px solid transparent;white-space:nowrap;margin-right:18px;
}
.tab.active{color:var(--paper);border-color:var(--indigo);}

/* ============ PROMPT BUILDER ============ */
.builder-layout{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;}
@media(max-width:980px){.builder-layout{grid-template-columns:1fr;}}
.block-picker{display:flex;flex-direction:column;gap:10px;}
.block-item{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
}
.block-item-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;}
.block-item-title{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
.block-item-title .badge{
  width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:11px;background:var(--indigo-soft);color:var(--indigo);flex-shrink:0;
}
.block-item-desc{font-size:12px;color:var(--mist-dim);line-height:1.5;margin-bottom:10px;}

.preview-pane{
  position:sticky;top:90px;background:#0B0D14;border:1px solid var(--line);border-radius:14px;
  overflow:hidden;box-shadow:var(--shadow-lg);
}
[data-theme="light"] .preview-pane{background:#14161C;}
.preview-bar{
  display:flex;align-items:center;gap:8px;padding:11px 16px;background:#12141B;border-bottom:1px solid #262A38;
}
[data-theme="light"] .preview-bar{background:#1A1C24;}
.preview-dot{width:10px;height:10px;border-radius:50%;}
.preview-title{font-family:var(--font-mono);font-size:11.5px;color:#8890A5;margin-left:6px;}
.preview-body{padding:20px;font-family:var(--font-mono);font-size:12.8px;line-height:1.75;color:#D6DAEA;
  max-height:520px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;}
.preview-body .ph-label{color:#6C63FF;font-weight:700;}
.preview-body .ph-empty{color:#4A5068;font-style:italic;}
.preview-cursor{display:inline-block;width:7px;height:14px;background:var(--amber);animation:blink 1s step-end infinite;vertical-align:middle;}
@keyframes blink{50%{opacity:0;}}
.preview-footer{padding:12px 16px;border-top:1px solid #262A38;display:flex;gap:8px;}

/* ============ LOOP BUILDER visual ============ */
.loop-visual{
  display:flex;align-items:center;justify-content:center;gap:6px;padding:22px 10px;flex-wrap:wrap;
}
.loop-node{
  background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:10px 14px;
  font-size:11.5px;font-weight:600;text-align:center;min-width:88px;
}
.loop-arrow{color:var(--mist-dim);font-size:16px;}

/* ============ MODAL ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(6,7,12,.7);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal{
  background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:640px;width:100%;
  max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-lg);
}
.modal-lg{max-width:820px;}
.modal-head{
  display:flex;align-items:flex-start;justify-content:space-between;padding:22px 24px 0;gap:12px;
}
.modal-head h2{font-size:19px;}
.modal-body{padding:18px 24px 24px;}
.modal-foot{padding:16px 24px 22px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);margin-top:6px;padding-top:16px;}

/* ============ TOAST ============ */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{
  background:var(--panel-3);border:1px solid var(--line);border-radius:11px;padding:12px 16px;
  font-size:13px;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-lg);
  animation:toast-in .25s ease;min-width:220px;
}
@keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.toast .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}

/* ============ EMPTY STATE ============ */
.empty{text-align:center;padding:60px 20px;color:var(--mist-dim);}
.empty svg{width:44px;height:44px;margin-bottom:14px;opacity:.5;}
.empty h3{font-size:15px;color:var(--paper);margin-bottom:6px;}
.empty p{font-size:13px;max-width:340px;margin:0 auto;}

/* ============ TOOLBAR ============ */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
.search-box{
  flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:9px 13px;
}
.search-box input{background:none;border:none;color:var(--paper);font-size:13px;width:100%;}
.search-box svg{width:15px;height:15px;color:var(--mist-dim);flex-shrink:0;}
.chip-filter{
  display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel);font-size:12.5px;color:var(--mist);
}
.chip-filter.active{background:var(--indigo-soft);color:var(--indigo);border-color:var(--indigo);}

/* onboarding */
.onb-steps{display:flex;gap:6px;margin-bottom:18px;}
.onb-step{height:4px;flex:1;background:var(--panel-3);border-radius:99px;overflow:hidden;}
.onb-step .fill{height:100%;background:var(--indigo);width:0%;transition:width .3s;}
.onb-icon-big{
  width:56px;height:56px;border-radius:16px;background:var(--indigo-soft);color:var(--indigo);
  display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:24px;
}

/* var chip inside builder */
.var-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.var-row input{flex:1;}
.var-remove{color:var(--mist-dim);background:none;border:none;width:26px;height:26px;border-radius:7px;flex-shrink:0;}
.var-remove:hover{background:var(--panel-2);color:var(--red);}

.kbd-list{display:flex;flex-direction:column;gap:8px;}
.kbd-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);}
.kbd-row:last-child{border:none;}
.kbd{font-family:var(--font-mono);font-size:11px;background:var(--panel-3);padding:3px 8px;border-radius:6px;border:1px solid var(--line);}

.category-pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.cat-pill{
  padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);
  font-size:12.5px;font-weight:600;color:var(--mist);display:flex;align-items:center;gap:7px;
}
.cat-pill.active{background:var(--paper);color:var(--ink);border-color:var(--paper);}
.cat-pill .count{opacity:.6;font-weight:400;}

@media(max-width:860px){
  .sidebar{position:fixed;left:-280px;transition:left .25s;box-shadow:var(--shadow-lg);}
  .sidebar.open{left:0;}
  .topbar{padding:14px 18px;}
  .content{padding:20px 18px 80px;}
  .mobile-menu-btn{display:flex;}
}
.mobile-menu-btn{display:none;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
</style>
</head>
<body>

<div class="app">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <div class="brand-logo">AI</div>
        <div>
          <div class="brand-title">Personal AI Playbook</div>
        </div>
      </div>
      <div class="brand-sub">Your reusable AI workflow system</div>
    </div>

    <nav class="nav" id="navList">
      <div class="nav-group-label">Overview</div>
      <button class="nav-item" data-view="dashboard"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Dashboard</span></button>

      <div class="nav-group-label">Create</div>
      <button class="nav-item" data-view="promptbuilder"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/><circle cx="12" cy="12" r="3"/></svg><span>Prompt Builder</span><span class="nav-kbd">P</span></button>
      <button class="nav-item" data-view="loopbuilder"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg><span>Loop Builder</span><span class="nav-kbd">L</span></button>

      <div class="nav-group-label">Library</div>
      <button class="nav-item" data-view="workflows"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg><span>My Workflows</span><span class="nav-kbd">W</span></button>
      <button class="nav-item" data-view="categories"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span>Categories</span></button>

      <div class="nav-group-label">System</div>

<script>
/* =========================================================================
   PERSONAL AI PLAYBOOK — application logic
   Vanilla JS. State persisted to localStorage. No external dependencies.
   ========================================================================= */

/* ---------------- Constants: building blocks & templates ---------------- */

const CATEGORIES = [
  {id:'build',    name:'Coding & Builds',        icon:'💻', color:'#6C63FF', desc:'Scoping, generating, and shipping single-file apps and projects.'},
  {id:'prep',     name:'DSA & Placement Prep',   icon:'🧠', color:'#4ADE80', desc:'Practice problems, mock interviews, and study systems for October drives.'},
  {id:'content',  name:'Content Creation',       icon:'✍️', color:'#F2A93B', desc:'LinkedIn posts, cover images, and README writing.'},
  {id:'career',   name:'Career Documents',       icon:'📄', color:'#F87171', desc:'Resume, LinkedIn profile, and job-search materials.'},
  {id:'research', name:'Research & Comparison',  icon:'🔎', color:'#38BDF8', desc:'Structured comparisons and grounded research summaries.'},
];

const MODELS = ['Claude','ChatGPT','Either (model-agnostic)'];

// Building block library used by Prompt Builder. Each has label + help text + input type.
const PROMPT_BLOCKS = [
  {id:'role', name:'Role', icon:'🎭', help:'Tells the AI what persona or expertise to adopt. Framing the model as "an expert X" focuses its vocabulary, assumptions, and standards on that domain — this is usually the single highest-leverage sentence in a prompt.',
    placeholder:'e.g. You are a senior frontend developer and UX designer.'},
  {id:'objective', name:'Objective', icon:'🎯', help:'The single, concrete outcome you want. Vague objectives ("help me with X") produce vague output — a specific, checkable objective gives the model something to aim at and gives you something to verify against.',
    placeholder:'e.g. Interview me one question at a time, then build a single-file HTML app.'},
  {id:'context', name:'Context', icon:'🗂️', help:'Background the model needs but wouldn\'t otherwise have — who this is for, constraints already decided, prior work, deadlines. Without context the model fills gaps with generic assumptions.',
    placeholder:'e.g. This is Day 49 of a 60-day public build challenge, paired with a LinkedIn post.'},
  {id:'constraints', name:'Constraints', icon:'🚧', help:'Hard boundaries the output must respect — format limits, banned approaches, technical restrictions. Constraints narrow the solution space so the model stops guessing what\'s off-limits.',
    placeholder:'e.g. No external libraries. Single HTML file only. Dark mode by default.'},
  {id:'reasoning', name:'Reasoning strategy', icon:'🧩', help:'How you want the model to think before answering — step by step, compare options first, ask clarifying questions first. This shapes the model\'s process, not just its final answer, which improves reliability on non-trivial tasks.',
    placeholder:'e.g. Think through 2-3 structural options before picking one and explain the choice.'},
  {id:'output', name:'Output format', icon:'📐', help:'The exact shape the response should take — a table, numbered steps, code only, a specific file type. Naming the format up front avoids a back-and-forth reformatting pass.',
    placeholder:'e.g. Return a single .html file with inline CSS and JS, no explanation text.'},
  {id:'tone', name:'Tone', icon:'🎚️', help:'The voice and register of the output — formal, casual, technical, encouraging. Matters most for writing tasks (posts, emails, feedback) where wording is the deliverable, not just information.',
    placeholder:'e.g. Confident, concise, first-person, no corporate buzzwords.'},
  {id:'examples', name:'Examples', icon:'🖼️', help:'One or two sample inputs/outputs that show, not tell, what "good" looks like. Examples are often more effective than extra instructions because they remove ambiguity about style and level of detail.',
    placeholder:'e.g. Here is a project README I liked: [paste]. Match this structure.'},
  {id:'quality', name:'Quality checks', icon:'✅', help:'A checklist the model should verify its own output against before finishing — this catches errors the model would otherwise ship, and teaches it what "done" means for this task.',
    placeholder:'e.g. Confirm the file has zero external dependencies and runs by double-clicking it.'},
];

// Loop builder blocks
const LOOP_BLOCKS = [
  {id:'goal', name:'Goal', icon:'🏁', help:'What the loop is ultimately trying to achieve. This is the north star every iteration is checked against — without it, the loop has no way to know if it\'s making progress.',
    placeholder:'e.g. Produce a bug-free, fully responsive single-file HTML app.'},
  {id:'eval', name:'Evaluation criteria', icon:'📊', help:'The specific, checkable signals that tell the loop whether the current attempt is good enough — these turn "is this done?" from a feeling into a test.',
    placeholder:'e.g. Runs with no console errors. Passes on mobile width. All buttons functional.'},
  {id:'strategy', name:'Improvement strategy', icon:'🔁', help:'How the loop should change its approach between attempts — what to try differently, in what order. Without this, retries tend to repeat the same mistake.',
    placeholder:'e.g. On failure, isolate the failing feature, fix only that, then re-run the full check.'},
  {id:'stop', name:'Stop conditions', icon:'🛑', help:'The exact conditions that end the loop — either success, a max number of attempts, or a signal that it\'s stuck. This prevents endless or runaway iteration.',
    placeholder:'e.g. Stop after 5 attempts or once all evaluation criteria pass, whichever comes first.'},
  {id:'safety', name:'Safety rules', icon:'🛡️', help:'Boundaries the loop must never cross while iterating on its own — e.g. never delete files, never call paid APIs, always show a diff before applying changes. Critical for any prompt that runs unsupervised.',
    placeholder:'e.g. Never overwrite the original file directly — always output as a new version.'},
];

// Pre-built workflow templates, tailored to the interview answers
const DEFAULT_WORKFLOWS = [
  {
    id:'wf-build-scope',
    title:'Interview-First Project Scoping',
    category:'build',
    model:'Claude',
    desc:'Turns a vague app idea into a fully-scoped single-file HTML build via a structured interview.',
    icon:'💻',
    template:`You are an expert frontend developer and UX designer.

Interview me one question at a time (MCQs where possible) before writing any code. Discover:
- What the app should do (core purpose)
- Who it's for
- Must-have vs nice-to-have features
- Visual style direction ({{style_direction}})

Once you have enough context, build a single self-contained HTML file using only HTML, CSS, and JavaScript — no external libraries. Requirements:
- {{theme}} theme by default
- Fully responsive down to mobile
- Zero external dependencies
- Polished, production-quality UI, not a rough prototype

Stop and confirm scope with me before you start building.`,
    variables:[{key:'style_direction',label:'Style direction',type:'select',options:['dark navy/purple glassmorphism','warm brown/beige educational','minimal & clean','bold & playful'],default:'dark navy/purple glassmorphism'},
               {key:'theme',label:'Theme',type:'select',options:['Dark','Light','Dark with light toggle'],default:'Dark'}],
  },
  {
    id:'wf-build-readme',
    title:'GitHub README Generator',
    category:'build',
    model:'Claude',
    desc:'Generates a clean, recruiter-friendly README for a finished build, separate from LinkedIn content.',
    icon:'📘',
    template:`You are a technical writer who creates concise, skimmable GitHub READMEs for portfolio projects.

Project: {{project_name}}
What it does: {{project_summary}}
Tech used: {{tech_stack}}

Write a README with: a one-line description, a short feature list, tech stack badges section, how to run it (just "open index.html"), and a screenshots placeholder section. Keep it under 150 lines. Do not include marketing language — describe what it does, plainly.`,
    variables:[{key:'project_name',label:'Project name',type:'text',default:''},
               {key:'project_summary',label:'One-line summary',type:'text',default:''},
               {key:'tech_stack',label:'Tech stack',type:'text',default:'HTML, CSS, JavaScript (vanilla)'}],
  },
  {
    id:'wf-prep-mock',
    title:'Mock Technical Interview',
    category:'prep',
    model:'Either (model-agnostic)',
    desc:'Runs a realistic mock interview for a specific role and gives structured feedback after.',
    icon:'🎤',
    template:`You are a senior hiring interviewer for {{role}} roles at a mid-size tech company.

Run a mock interview with me covering {{round_type}}. Ask one question at a time, wait for my answer, then respond as a real interviewer would (follow-ups, gentle pushback on weak answers) — don't give feedback mid-interview.

After {{num_questions}} questions, stop and give me structured feedback: what was strong, what to improve, and a score out of 10 for communication and correctness separately.`,
    variables:[{key:'role',label:'Target role',type:'text',default:'Full Stack Developer (entry-level)'},
               {key:'round_type',label:'Round type',type:'select',options:['DSA/coding problems','system design basics','HR/behavioral','resume deep-dive'],default:'DSA/coding problems'},
               {key:'num_questions',label:'Number of questions',type:'select',options:['3','5','8'],default:'5'}],
  },
  {
    id:'wf-prep-dsa',
    title:'DSA Practice Set (Java)',
    category:'prep',
    model:'Claude',
    desc:'Generates a focused practice set on one DSA topic with graded difficulty and Java solutions.',
    icon:'🧮',
    template:`You are a DSA coach preparing me for campus placement drives. I practice in Java.

Give me {{count}} problems on {{topic}}, ordered easy to hard. For each: problem statement, constraints, and a hint — but not the solution yet. Wait for me to attempt each one before revealing your Java solution with time/space complexity.`,
    variables:[{key:'topic',label:'Topic',type:'select',options:['Arrays','Linked Lists','Trees','Graphs','Dynamic Programming','Strings','Recursion & Backtracking'],default:'Arrays'},
               {key:'count',label:'Number of problems',type:'select',options:['3','5','10'],default:'5'}],
  },
  {
    id:'wf-content-post',
    title:'LinkedIn Post from Project',
    category:'content',
    model:'Either (model-agnostic)',
    desc:'Converts a finished build or milestone into a short, casual LinkedIn post.',
    icon:'📝',
    template:`You are a LinkedIn content writer who writes short, casual, plain-language posts for a student building in public.

Turn this into a LinkedIn post: {{project_or_milestone}}

Constraints:
- Short and casual, no corporate buzzwords
- {{tone}}
- End with one genuine question to invite comments, not a generic call-to-action
- Put any GitHub link note as "link in comments", not in the post body`,
    variables:[{key:'project_or_milestone',label:'What happened',type:'textarea',default:''},
               {key:'tone',label:'Tone',type:'select',options:['Confident and matter-of-fact','Reflective/learning-in-public','Excited/high-energy'],default:'Confident and matter-of-fact'}],
  },
  {
    id:'wf-content-cover',
    title:'LinkedIn Cover Image Brief',
    category:'content',
    model:'Claude',
    desc:'Produces a design brief for a branded 1080×1080 LinkedIn cover image, kept neutral (no screenshots).',
    icon:'🖼️',
    template:`You are a brand designer creating LinkedIn cover images for a daily build challenge.

Create a design brief for a 1080x1080 PNG cover image for: {{project_title}}

Style: dark navy/purple glassmorphism, consistent with prior covers in this series.
Must NOT include app screenshots — use abstract/neutral visuals only, with the project title and day number ({{day_number}}) as the focal text.`,
    variables:[{key:'project_title',label:'Project title',type:'text',default:''},
               {key:'day_number',label:'Day number',type:'text',default:''}],
  },
  {
    id:'wf-career-resume',
    title:'Resume Bullet Rewrite (ATS)',
    category:'career',
    model:'Claude',
    desc:'Rewrites resume bullets to be ATS-friendly and quantified for a target role.',
    icon:'📄',
    template:`You are an ATS resume optimization expert for entry-level {{target_role}} roles.

Rewrite these bullet points to be ATS-friendly, quantified where possible, and action-verb led. Do not invent metrics I haven't given you — flag where a number is missing instead.

Bullets:
{{bullets}}`,
    variables:[{key:'target_role',label:'Target role',type:'text',default:'Full Stack Developer'},
               {key:'bullets',label:'Current bullets',type:'textarea',default:''}],
  },
  {
    id:'wf-research-compare',
    title:'Structured Comparison Research',
    category:'research',
    model:'Claude',
    desc:'Produces a grounded, source-backed comparison table between a set of named options.',
    icon:'🔎',
    template:`You are a research analyst. Compare the following options on {{criteria}}: {{options_list}}

Use current web sources where relevant — do not rely on memory for anything that changes over time (pricing, ratings, availability). Present as a comparison table, then a 3-sentence recommendation based on {{priority}}.`,
    variables:[{key:'options_list',label:'Options to compare',type:'text',default:''},
               {key:'criteria',label:'Comparison criteria',type:'text',default:'cost, learning curve, industry recognition'},
               {key:'priority',label:'What matters most',type:'text',default:'value for a student on a budget'}],
  },
];

/* ---------------- State ---------------- */

const LS_KEYS = {workflows:'aiplaybook_workflows', settings:'aiplaybook_settings', onboarded:'aiplaybook_onboarded', explainerDismissed:'aiplaybook_explainer_dismissed'};

let state = {
  view:'dashboard',
  workflows: loadWorkflows(),
  settings: loadSettings(),
  search:'',
  categoryFilter:'all',
  favOnly:false,
  pbSelected:[], // prompt builder selected block ids in order
  pbValues:{},
  lbSelected:[],
  lbValues:{},
};

function loadWorkflows(){
  try{
    const raw = localStorage.getItem(LS_KEYS.workflows);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  // seed defaults, mark not-favorite, add usage count
  const seeded = DEFAULT_WORKFLOWS.map(w=>({...w, favorite:false, uses:0, custom:false, created:Date.now()}));
  saveWorkflowsRaw(seeded);
  return seeded;
}
function saveWorkflowsRaw(list){ localStorage.setItem(LS_KEYS.workflows, JSON.stringify(list)); }
function saveWorkflows(){ saveWorkflowsRaw(state.workflows); }

function loadSettings(){
  try{
    const raw = localStorage.getItem(LS_KEYS.settings);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {theme:'dark'};
}
function saveSettings(){ localStorage.setItem(LS_KEYS.settings, JSON.stringify(state.settings)); }

/* ---------------- Utility ---------------- */
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function $(sel,root=document){ return root.querySelector(sel); }
function $all(sel,root=document){ return [...root.querySelectorAll(sel)]; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'wf-'+Math.random().toString(36).slice(2,10); }

function toast(msg, kind='ok'){
  const wrap = $('#toastWrap');
  const t = el(`<div class="toast"><span class="dot" style="background:${kind==='ok'?'var(--green)':kind==='err'?'var(--red)':'var(--amber)'}"></span><span>${escapeHtml(msg)}</span></div>`);
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2600);
}

function copyToClipboard(text){
  navigator.clipboard?.writeText(text).then(()=>toast('Copied to clipboard')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); toast('Copied to clipboard');
  });
}

function categoryMeta(id){ return CATEGORIES.find(c=>c.id===id) || {icon:'✨',color:'#8890A5',name:id}; }

/* ---------------- Theme ---------------- */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.settings.theme==='light'?'light':'dark');
}
function toggleTheme(){
  state.settings.theme = state.settings.theme==='light' ? 'dark' : 'light';
  saveSettings(); applyTheme(); toast('Switched to '+state.settings.theme+' mode','info');
}

/* ---------------- Navigation ---------------- */
const VIEW_META = {
  dashboard:{title:'Dashboard', sub:'Your saved AI prompt workflows, at a glance'},
  promptbuilder:{title:'Prompt Builder', sub:'Assemble a prompt from reusable building blocks, with a live preview'},
  loopbuilder:{title:'Loop Builder', sub:'Turn a normal prompt into a self-correcting, autonomous loop'},
  workflows:{title:'My Workflows', sub:'Search, filter, edit, and reuse your saved prompt systems'},
  categories:{title:'Categories', sub:'Workflows grouped by what they help you do'},
  settings:{title:'Import / Export', sub:'Back up your workflows or move them to another device'},
};

function navigate(view){
  state.view = view;
  $all('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  $('#pageTitle').textContent = VIEW_META[view].title;
  $('#pageSub').textContent = VIEW_META[view].sub;
  render();
  $('#sidebar').classList.remove('open');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ================= RENDER: DASHBOARD ================= */
function renderDashboard(){
  const total = state.workflows.length;
  const favs = state.workflows.filter(w=>w.favorite).length;
  const custom = state.workflows.filter(w=>w.custom).length;
  const explainerDismissed = localStorage.getItem(LS_KEYS.explainerDismissed)==='1';

  const recentWfs = [...state.workflows].sort((a,b)=>b.created-a.created).slice(0,3);

  return `
    ${explainerDismissed ? '' : renderExplainer()}

    <div class="section">
      <div class="grid grid-3">
        <div class="stat-card"><div class="num">${total}</div><div class="lbl">Saved workflows</div></div>
        <div class="stat-card"><div class="num">${favs}</div><div class="lbl">Favorited for quick access</div></div>
        <div class="stat-card"><div class="num">${custom}</div><div class="lbl">Built by you from scratch</div></div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>Jump into a builder</h2>
        <span class="muted">Both save straight into My Workflows</span>
      </div>
      <div class="grid grid-2">
        <div class="card" style="cursor:pointer" onclick="navigate('promptbuilder')">
          <div class="wf-icon" style="background:var(--indigo-soft);color:var(--indigo);margin-bottom:10px;">🧩</div>
          <div class="wf-title" style="margin-bottom:4px;">Prompt Builder</div>
          <div class="wf-desc">Assemble a one-shot prompt from blocks — role, objective, context, constraints, and more — with a live preview as you go.</div>
        </div>
        <div class="card" style="cursor:pointer" onclick="navigate('loopbuilder')">
          <div class="wf-icon" style="background:var(--amber-soft);color:var(--amber);margin-bottom:10px;">🔁</div>
          <div class="wf-title" style="margin-bottom:4px;">Loop Builder</div>
          <div class="wf-desc">Turn any prompt into an autonomous loop that keeps improving its own output until your stop conditions are met.</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>Recently added</h2>
        <button class="btn btn-ghost btn-sm" onclick="navigate('workflows')">View all →</button>
      </div>
      <div class="grid grid-3" id="recentGrid">
        ${recentWfs.map(w=>workflowCardHtml(w)).join('')}
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>Categories</h2><span class="muted">Only the ones relevant to your work</span></div>
      <div class="grid grid-3">
        ${CATEGORIES.map(c=>{
          const count = state.workflows.filter(w=>w.category===c.id).length;
          return `<div class="card" style="cursor:pointer" onclick="openCategory('${c.id}')">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
              <div class="wf-icon" style="background:${c.color}22;color:${c.color};">${c.icon}</div>
              <div>
                <div class="wf-title">${c.name}</div>
                <div style="font-size:11.5px;color:var(--mist-dim)">${count} workflow${count===1?'':'s'}</div>
              </div>
            </div>
            <div class="wf-desc">${c.desc}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function renderExplainer(){
  return `
  <div class="explainer" id="explainerBox">
    <button class="btn btn-icon btn-ghost explainer-close" id="explainerCloseBtn" title="Dismiss"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    <h3>👋 What this tool is</h3>
    <p>This is a personal system for writing better AI prompts, faster — instead of storing hundreds of finished prompts, it stores reusable <b>building blocks</b> (like "role" or "constraints") that you combine on demand. Your saved combinations live in <b>My Workflows</b>. Everything is stored only on this device (local storage) — nothing is sent anywhere.</p>
    <div class="explainer-grid">
      <div class="explainer-chip"><b>Dashboard</b><span>Overview of your saved workflows and quick stats</span></div>
      <div class="explainer-chip"><b>Prompt Builder</b><span>Assemble one-shot prompts from labeled blocks</span></div>
      <div class="explainer-chip"><b>Loop Builder</b><span>Turn a prompt into a self-correcting loop</span></div>
      <div class="explainer-chip"><b>My Workflows</b><span>Search, edit, favorite, and reuse what you've saved</span></div>
    </div>
  </div>`;
}

function workflowCardHtml(w){
  const cat = categoryMeta(w.category);
  return `
  <div class="card workflow-card" onclick="openWorkflowModal('${w.id}')">
    <div class="wf-top">

        <div class="block-item-title"><span class="badge">${b.icon}</span>${b.name}</div>

      </div>

      ${active? `<textarea data-block="${b.id}" placeholder="${b.placeholder}" oninput="onLbInput('${b.id}', this.value)">${escapeHtml(state.lbValues[b.id]||'')}</textarea>` : ''}
    </div>`;
  }).join('');
}
function toggleLbBlock(id){
  const idx = state.lbSelected.indexOf(id);
  if(idx>-1) state.lbSelected.splice(idx,1);
  else state.lbSelected.push(id);
  renderLbPicker(); updateLbPreview();
}
function onLbInput(id,val){ state.lbValues[id]=val; updateLbPreview(); }

function assembledLoop(){
  const base = $('#lbBase')?.value.trim();
  if(!base && state.lbSelected.length===0) return '';
  let parts = [];
  if(base) parts.push(`[TASK]\n${base}`);
  LOOP_BLOCKS.filter(b=>state.lbSelected.includes(b.id)).forEach(b=>{
    const val = (state.lbValues[b.id]||'').trim();
    if(val) parts.push(`[${b.name.toUpperCase()}]\n${val}`);
  });
  if(parts.length===0) return '';
  parts.push(`[LOOP INSTRUCTION]\nRepeat: attempt → self-evaluate against the criteria above → improve → recheck stop conditions. Show your evaluation at each step before continuing.`);
  return parts.join('\n\n');
}

  const text = assembledLoop();

function bindSettingsView(){
  $('#exportBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state.workflows,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='ai-playbook-workflows.json'; a.click();
    URL.revokeObjectURL(url);
    toast('Downloaded workflows.json');
  });
  $('#importBtn').addEventListener('click', ()=> $('#importInput').click());
  $('#importInput').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!Array.isArray(data)) throw new Error('bad format');
        const withIds = data.map(w=>({...w, id: w.id || uid()}));
        state.workflows = [...withIds, ...state.workflows];
        saveWorkflows();
        toast(`Imported ${withIds.length} workflow(s)`);
        navigate('workflows');
      }catch(err){ toast('That file could not be read as a workflow export','err'); }
    };
    reader.readAsText(file);
  });
  $('#resetBtn').addEventListener('click', ()=>{
    if(!confirm('This will delete all your custom workflows and restore the defaults. Continue?')) return;
    state.workflows = DEFAULT_WORKFLOWS.map(w=>({...w, favorite:false, uses:0, custom:false, created:Date.now()}));
    saveWorkflows();
    toast('Reset to defaults');
    navigate('dashboard');
  });
}

  $('#wfDuplicateBtn').addEventListener('click', ()=>{
    const copy = {...w, id:uid(), title:w.title+' (copy)', custom:true, created:Date.now()};
    state.workflows.unshift(copy); saveWorkflows();
    toast('Duplicated'); closeModal(); if(state.view==='workflows') rerenderWorkflowsOnly(); else render();
  });
  const delBtn = $('#wfDeleteBtn');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    if(!confirm('Delete this workflow? This cannot be undone.')) return;
    state.workflows = state.workflows.filter(x=>x.id!==w.id);
    saveWorkflows(); toast('Deleted'); closeModal();
    if(state.view==='workflows') rerenderWorkflowsOnly(); else render();
  });
}

function toggleFavorite(id){
  const w = state.workflows.find(x=>x.id===id);
  if(!w) return;
  w.favorite = !w.favorite; saveWorkflows();
  if(state.view==='workflows') rerenderWorkflowsOnly(); else render();
}

/* ================= NEW WORKFLOW MODAL (manual create) ================= */
function openNewWorkflowModal(){
  const overlay = el(`<div class="modal-overlay"></div>`);
  const modal = el(`<div class="modal"></div>`);
  modal.innerHTML = `
    <div class="modal-head"><h2>New workflow</h2>
      <button class="btn btn-icon btn-ghost" id="nwClose"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <p style="font-size:12.5px;color:var(--mist-dim);margin-bottom:16px;">For guided building with live preview, try the <a href="#" id="nwGoToBuilder" style="color:var(--indigo);font-weight:600;">Prompt Builder</a> instead — this form is for quickly saving a prompt you already have.</p>
      <div class="field"><label>Title</label><input type="text" id="nwTitle" placeholder="e.g. Weekly reflection post"></div>
      <div class="field"><label>Category</label><select id="nwCategory">${CATEGORIES.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('')}</select></div>
      <div class="field"><label>Target model</label><select id="nwModel">${MODELS.map(m=>`<option>${m}</option>`).join('')}</select></div>
      <div class="field"><label>Short description</label><input type="text" id="nwDesc" placeholder="What does this workflow do?"></div>
      <div class="field"><label>Prompt template <span class="hint" style="display:block;">Use {{variable_name}} for parts you'll want to customize each time.</span></label><textarea id="nwTemplate" style="min-height:140px;" placeholder="You are a..."></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" id="nwSave">Save workflow</button>
    </div>
  `;
  overlay.appendChild(modal); document.body.appendChild(overlay);
  function close(){ overlay.remove(); }
  $('#nwClose',modal).addEventListener('click', close);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  $('#nwGoToBuilder',modal).addEventListener('click', e=>{ e.preventDefault(); close(); navigate('promptbuilder'); });
  $('#nwSave',modal).addEventListener('click', ()=>{
    const title = $('#nwTitle',modal).value.trim();
    const template = $('#nwTemplate',modal).value.trim();
    if(!title || !template){ toast('Add at least a title and prompt template','err'); return; }
    // auto-detect {{variables}}
    const varMatches = [...template.matchAll(/\{\{(\w+)\}\}/g)].map(m=>m[1]);
    const uniqueVars = [...new Set(varMatches)];
    const wf = {
      id:uid(), title, category:$('#nwCategory',modal).value, model:$('#nwModel',modal).value,
      desc: $('#nwDesc',modal).value.trim() || 'Custom saved workflow.', icon:'✨',
      template, variables: uniqueVars.map(v=>({key:v,label:v.replace(/_/g,' '),type:'text',default:''})),
      favorite:false, uses:0, custom:true, created:Date.now(),
    };
    state.workflows.unshift(wf); saveWorkflows();
    toast('Workflow saved'); close(); navigate('workflows');
  });
}

/* ================= ONBOARDING MODAL ================= */
function openOnboarding(force){
  if(!force && localStorage.getItem(LS_KEYS.onboarded)==='1') return;
  let step = 0;
  const steps = [
    {icon:'👋', title:'Welcome to your Personal AI Playbook', body:'This is a system for turning how you already use AI into reusable, editable workflows — instead of rewriting prompts from scratch every day.'},
    {icon:'🧩', title:'Prompt Builder & Loop Builder', body:'Assemble prompts from labeled building blocks (role, objective, constraints...) with a live preview, or turn any prompt into a self-correcting loop with goals and stop conditions.'},
    {icon:'📚', title:'My Workflows', body:'Everything you save lives here — searchable, filterable by category, favoritable, and editable. It\'s all stored locally on this device via your browser\'s local storage.'},
  ];
  const overlay = el(`<div class="modal-overlay"></div>`);
  const modal = el(`<div class="modal"></div>`);
  function paint(){
    const s = steps[step];
    modal.innerHTML = `
      <div class="modal-body" style="padding-top:26px;">
        <div class="onb-steps">${steps.map((_,i)=>`<div class="onb-step"><div class="fill" style="width:${i<=step?100:0}%"></div></div>`).join('')}</div>
        <div class="onb-icon-big">${s.icon}</div>
        <h2 style="font-size:19px;margin-bottom:10px;">${s.title}</h2>
        <p style="font-size:13.5px;color:var(--mist);line-height:1.6;">${s.body}</p>
      </div>
      <div class="modal-foot" style="justify-content:space-between;">
        <button class="btn btn-ghost btn-sm" id="onbSkip">Skip</button>
        <button class="btn btn-primary" id="onbNext">${step<steps.length-1?'Next':'Get started'}</button>
      </div>`;
    $('#onbSkip',modal).addEventListener('click', finish);
    $('#onbNext',modal).addEventListener('click', ()=>{
      if(step<steps.length-1){ step++; paint(); } else finish();
    });
  }
  function finish(){ localStorage.setItem(LS_KEYS.onboarded,'1'); overlay.remove(); }
  overlay.appendChild(modal); document.body.appendChild(overlay);
  paint();
}

/* ================= HELP / "WHAT IS THIS?" MODAL ================= */

  const overlay = el(`<div class="modal-overlay"></div>`);
  const modal = el(`<div class="modal"></div>`);
  modal.innerHTML = `
    <div class="modal-head"><h2>What is this?</h2>
      <button class="btn btn-icon btn-ghost" id="hmClose"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <p style="font-size:13.5px;color:var(--mist);line-height:1.7;margin-bottom:16px;">The <b>Personal AI Playbook</b> helps you turn how you use AI day-to-day into reusable, editable systems instead of one-off prompts you rewrite each time.</p>
      <div class="field"><label>Dashboard</label><div class="hint">An overview of your saved workflows, quick stats, and shortcuts into the two builders.</div></div>
      <div class="field"><label>Prompt Builder</label><div class="hint">Assemble a single prompt from labeled building blocks (role, objective, context, constraints, reasoning strategy, output format, tone, examples, quality checks) with a live preview.</div></div>
      <div class="field"><label>Loop Builder</label><div class="hint">Turn a normal prompt into a self-correcting loop by defining a goal, evaluation criteria, an improvement strategy, stop conditions, and safety rules.</div></div>
      <div class="field"><label>My Workflows</label><div class="hint">Everything you've saved — searchable, filterable by category, favoritable, editable, and duplicable.</div></div>
      <div class="field"><label>Categories</label><div class="hint">The same workflows, grouped by what they help you do.</div></div>
      <div class="field"><label>Import / Export</label><div class="hint">Back up your workflows as a JSON file, or load them onto another device.</div></div>
      <p style="font-size:12px;color:var(--mist-dim);margin-top:10px;">Everything is stored only in this browser's local storage — nothing is uploaded anywhere.</p>
    </div>
  `;
  overlay.appendChild(modal); document.body.appendChild(overlay);
  $('#hmClose',modal).addEventListener('click', ()=>overlay.remove());
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
}

/* ================= SHORTCUTS MODAL ================= */
function openShortcutsModal(){
  const overlay = el(`<div class="modal-overlay"></div>`);
  const modal = el(`<div class="modal"></div>`);
  const rows = [
    ['Go to Dashboard','G then D'],['Prompt Builder','P'],['Loop Builder','L'],['My Workflows','W'],
    ['New workflow','N'],['Search (in My Workflows)','/'],['Toggle theme','T'],['Close any modal','Esc'],
  ];
  modal.innerHTML = `
    <div class="modal-head"><h2>Keyboard shortcuts</h2>
      <button class="btn btn-icon btn-ghost" id="smClose"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="kbd-list">${rows.map(([label,key])=>`<div class="kbd-row"><span>${label}</span><span class="kbd">${key}</span></div>`).join('')}</div>
    </div>`;
  overlay.appendChild(modal); document.body.appendChild(overlay);
  $('#smClose',modal).addEventListener('click', ()=>overlay.remove());
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
}

/* ================= MAIN RENDER DISPATCH ================= */
function render(){
  const content = $('#content');
  switch(state.view){
    case 'dashboard': content.innerHTML = renderDashboard(); break;
    case 'promptbuilder': content.innerHTML = renderPromptBuilder(); bindPromptBuilder(); break;
    case 'loopbuilder': content.innerHTML = renderLoopBuilder(); bindLoopBuilder(); break;
    case 'workflows': content.innerHTML = renderWorkflows(); bindWorkflowsView(); break;
    case 'categories': content.innerHTML = renderCategories(); break;
    case 'settings': content.innerHTML = renderSettings(); bindSettingsView(); break;
  }
  if(state.view==='dashboard'){
    const closeBtn = $('#explainerCloseBtn');
    if(closeBtn) closeBtn.addEventListener('click', ()=>{
      localStorage.setItem(LS_KEYS.explainerDismissed,'1');
      $('#explainerBox').style.display='none';
    });
  }
}

/* ================= GLOBAL EVENT WIRING ================= */
$all('.nav-item').forEach(btn=> btn.addEventListener('click', ()=> navigate(btn.dataset.view)));
$('#whatIsThisBtn').addEventListener('click', openHelpModal);
$('#helpBtnTop').addEventListener('click', openHelpModal);
$('#shortcutsBtn').addEventListener('click', openShortcutsModal);
$('#themeToggle').addEventListener('click', toggleTheme);
$('#newWorkflowBtn').addEventListener('click', openNewWorkflowModal);
$('#mobileMenuBtn').addEventListener('click', ()=> $('#sidebar').classList.toggle('open'));

document.addEventListener('keydown', (e)=>{
  if(e.target.matches('input,textarea,select')) {
    if(e.key==='Escape') e.target.blur();
    return;
  }
  const overlay = $('.modal-overlay');
  if(e.key==='Escape'){ if(overlay) overlay.remove(); return; }
  if(overlay) return; // don't trigger nav shortcuts while a modal is open
  switch(e.key.toLowerCase()){
    case 'p': navigate('promptbuilder'); break;
    case 'l': navigate('loopbuilder'); break;
    case 'w': navigate('workflows'); break;
    case 'n': openNewWorkflowModal(); break;
    case 't': toggleTheme(); break;
    case '/': navigate('workflows'); setTimeout(()=>$('#wfSearch')?.focus(),50); e.preventDefault(); break;
    case 'g':
      document.addEventListener('keydown', function d2(ev){
        if(ev.key.toLowerCase()==='d'){ navigate('dashboard'); }
        document.removeEventListener('keydown', d2);
      }, {once:true});
      break;
  }
});

/* ================= INIT ================= */
applyTheme();
navigate('dashboard');
setTimeout(()=>openOnboarding(false), 400);

// expose functions used via inline HTML handlers
window.navigate = navigate;
window.openWorkflowModal = openWorkflowModal;
window.toggleFavorite = toggleFavorite;
window.openCategory = openCategory;
window.togglePbBlock = togglePbBlock;
window.onPbInput = onPbInput;
window.toggleLbBlock = toggleLbBlock;
window.onLbInput = onLbInput;
window.updateLbPreview = updateLbPreview;

</script>
